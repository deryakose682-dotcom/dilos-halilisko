<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diloş & Halilişko’nun Hikayesi 💞</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #fff);
      color: #444;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5rem;
      color: #ff6fae;
      margin-top: 40px;
    }

    .counter {
      font-size: 1.2rem;
      margin: 20px 0;
      color: #ff3e8b;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    .photo-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .photo-card:hover {
      transform: scale(1.05);
    }

    .photo-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .caption {
      padding: 10px;
      font-size: 0.95rem;
      color: #ff3e8b;
      background: #fffafc;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .heart {
      position: absolute;
      color: #ff6fae;
      animation: float 6s ease-in infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }

    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Diloş & Halilişko’nun Hikayesi 💞</h1>

  <div class="gallery">
    <div class="photo-card"><img src="fotograf/fotograf1.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf2.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf3.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf4.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf5.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf6.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf7.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf8.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf9.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf10.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf11.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf12.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf13.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf14.jpg"><div class="caption">💖</div></div>
    <div class="photo-card"><img src="fotograf/fotograf15.jpg"><div class="caption">💖</div></div>
  </div>

  <audio controls autoplay loop>
    <source src="https://www.youtube.com/embed/DNGG4l8Kw2A" type="audio/mpeg">
    Tarayıcınız ses dosyasını desteklemiyor.
  </audio>

  <div class="hearts"></div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.textContent = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 3 + "s";
      document.querySelector(".hearts").appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 400);
  </script>
</body>
</html>
